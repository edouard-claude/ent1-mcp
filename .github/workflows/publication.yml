# Sur un tag vX.Y.Z : image Docker sur GHCR, puis publication dans le
# registre officiel MCP (authentification OIDC, aucun secret à gérer).
name: Publication

on:
  push:
    tags: ["v*"]

jobs:
  publier:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - name: Vérifier que le tag correspond aux versions déclarées
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          grep -q "^version = \"$VERSION\"" Cargo.toml
          jq -e --arg v "$VERSION" '.version == $v and (.packages[0].identifier | endswith(":" + $v))' server.json

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construire et pousser l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/edouard-claude/ent1-mcp:${{ github.ref_name }}
            ghcr.io/edouard-claude/ent1-mcp:latest
          # Le registre MCP attend le tag sans « v » (cf. server.json).
          # On pousse donc aussi X.Y.Z.
      - name: Ajouter le tag X.Y.Z
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          docker buildx imagetools create -t "ghcr.io/edouard-claude/ent1-mcp:$VERSION" "ghcr.io/edouard-claude/ent1-mcp:${GITHUB_REF_NAME}"

      - name: Installer mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher

      - name: Publier dans le registre MCP
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish

[package]
name = "ent1-mcp"
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
description = "Serveur MCP (Model Context Protocol) pour l'ENT ONE / Edifice : messagerie, carnet de liaison, cahier de texte, actualités."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/edouard-claude/ent1-mcp"
homepage = "https://github.com/edouard-claude/ent1-mcp"
keywords = ["mcp", "ent", "education", "edifice", "llm"]
categories = ["command-line-utilities", "api-bindings"]

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
base64 = "0.23.1"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
html-escape = "0.2.15"
html2text = "0.17.1"
jiff = "0.2.37"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "cookies", "rustls", "form", "query", "multipart", "stream"] }
rmcp = { version = "3.5.0", features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
schemars = "1.2.2"
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
subtle = "2.6.1"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal", "sync"] }
tokio-util = "0.7.19"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
module_name_repetitions = "allow"
missing_errors_doc = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
